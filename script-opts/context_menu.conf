# ============================================================
# MPV 0.41 BUILT-IN CONTEXT MENU
# Crimson Cyber v4: compact, square, high-contrast, non-distracting.
# mpv 0.41 does not expose background alpha in this renderer.
# ============================================================

font_size=17
gap=0.24
padding_x=14
padding_y=7

menu_outline_size=1
menu_outline_color=#CC0A27
corner_radius=7
scale_with_window=auto

focused_color=#FFFFFF
focused_back_color=#CC0A27
disabled_color=#918282

# Fast, deliberate submenu timing for a responsive geometric UI.
seconds_to_open_submenus=0.18
seconds_to_close_submenus=0.22
