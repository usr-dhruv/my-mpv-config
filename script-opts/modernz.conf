# ============================================================
# MODERNZ 0.3.3 — Crimson Cyber v4
# UI ONLY. Playback/rendering quality remains in mpv.conf.
# ============================================================

language=default
layout=default
icon_theme=fluent
icon_style=filled
font="Righteous"

# Visibility
idlescreen=yes
window_top_bar=auto
showwindowed=yes
showfullscreen=yes
showonselect=yes
showonpause=yes
keeponpause=no
greenandgrumpy=no

# Behaviour
hidetimeout=2000
keep_with_cursor=yes
fadeduration=180
fadein=yes
minmousemove=3
deadzonesize=0.75
deadzone_hide=instant

osc_on_seek=yes
osc_on_start=both
mouse_seek_pause=yes
force_seek_tooltip=yes
vidscale=auto
scalewindowed=1.0
scalefullscreen=1.0


# Metadata
show_title=yes
title=${media-title}
title_font_size=21
truncate_title=yes
chapter_title_font_size=15
cache_info=no
cache_info_speed=no
cache_info_font_size=12
show_chapter_title=yes
chapter_above_title=no
chapter_fmt=%s
timecurrent=yes
timems=no
unicodeminus=yes
time_format=dynamic
time_font_size=14
tooltip_font_size=13
speed_font_size=14

# Window controls
show_window_title=no
window_title_font_size=24
window_controls=yes
windowcontrols_independent=yes

# Subtitle / OSD margins
sub_margins=yes
osd_margins=no
dynamic_margins=yes

# Maximum useful ModernZ features
subtitles_button=yes
audio_tracks_button=yes
jump_buttons=yes
jump_amount=10
jump_more_amount=60
jump_icon_number=yes
jump_mode=relative
jump_softrepeat=yes
chapter_skip_buttons=yes
track_nextprev_buttons=yes
volume_control=yes
volume_control_type=logarithmic
volumebar_unmute_on_click=no
playlist_button=yes
hide_empty_playlist_button=no
gray_empty_playlist_button=yes
fullscreen_button=yes
info_button=yes
ontop_button=yes
ontop_in_topbar=yes
screenshot_button=yes
download_button=yes
download_path=~~desktop/mpv
loop_button=yes
shuffle_button=yes
speed_button=yes
buttons_always_active=playlist_prev,playlist_next
playpause_size=30
midbuttons_size=24
sidebuttons_size=23
zoom_control=yes
zoom_in_max=4
zoom_out_min=-1


# ============================================================
# CRIMSON CYBER v4 — solid surfaces, sharp geometry, no gradients
# ============================================================
# The global OSC surface is transparent; crimson is reserved for active
# controls and progress so the video never sits under a red strip.
osc_color=#12141A
window_title_color=#F0E1E1
window_controls_color=#F0E1E1
windowcontrols_close_hover=#CC0A27
windowcontrols_max_hover=#FF6A00
windowcontrols_min_hover=#27AE60
title_color=#F0E1E1
cache_info_color=#918282
seekbar_cache_color=#3A2931
seekbarfg_color=#CC0A27
seekbarbg_color=#38303A
seek_handle_color=#F0E1E1
seek_handle_border_color=#CC0A27
volumebar_match_seek_color=yes
time_color=#F0E1E1
chapter_title_color=#F0E1E1
side_buttons_color=#D3C2C5
middle_buttons_color=#F0E1E1
playpause_color=#FFFFFF
held_element_color=#918282
hover_effect_color=#CC0A27
thumbnail_box_color=#12141A
thumbnail_box_outline=#CC0A27
nibble_color=#FF6A00
nibble_current_color=#FFFFFF
ab_loop_color=#FF6A00

# Soft geometry only where it improves targeting; no glow or full-width panel.
hover_effect=color,box
button_hover_size=105
button_glow_amount=0
button_held_box_alpha=38



# No global bottom panel: the video remains edge-to-edge and controls float
# over it. Small tooltip/window surfaces may still use restrained glass blur.
osc_fade_strength=0
fade_blur_strength=0
fade_transparency_strength=28
window_fade_strength=0
window_fade_blur_strength=0
window_fade_transparency_strength=28
thumbnail_box_padding=4
thumbnail_box_radius=5
thumbnail_box_outline_size=1

persistent_progress_height=2
