<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Core Background: Carbon / Obsidian -->
    <linearGradient id="chassisBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D313A" />
      <stop offset="35%" stop-color="#15171C" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>

    <!-- Edge Highlight for the Chassis -->
    <linearGradient id="chassisEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555B69" />
      <stop offset="50%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Deep Recessed Well (Solid gradient, no bloom) -->
    <linearGradient id="recess" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030304" />
      <stop offset="100%" stop-color="#15171C" />
    </linearGradient>

    <!-- Crimson Neon Laser Core -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0833" />
      <stop offset="50%" stop-color="#CC0A27" />
      <stop offset="100%" stop-color="#660014" />
    </linearGradient>

    <!-- Metallic Graphite Floating Shard -->
    <linearGradient id="shardFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#404652" />
      <stop offset="50%" stop-color="#1E2128" />
      <stop offset="100%" stop-color="#0E1013" />
    </linearGradient>

    <!-- Play Button Edge -->
    <linearGradient id="shardEdge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="60%" stop-color="#2A2E37" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>

    <!-- Tight Depth Filter (No wide blooms) -->
    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- 1. Main Hardware Chassis -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#chassisBase)" stroke="url(#chassisEdge)" stroke-width="4" filter="url(#shadowHeavy)" />
  
  <!-- Outer Rim Lighting -->
  <rect x="42" y="42" width="428" height="428" rx="98" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.12" />

  <!-- 2. Technical Panel Cuts (Embossed) -->
  <!-- Top Left -->
  <path d="M 38 180 L 120 180 L 160 140" fill="none" stroke="#000000" stroke-width="3" opacity="0.8" />
  <path d="M 38 182 L 121 182 L 162 141" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" />
  
  <!-- Bottom Right -->
  <path d="M 474 332 L 392 332 L 352 372" fill="none" stroke="#000000" stroke-width="3" opacity="0.8" />
  <path d="M 474 334 L 391 334 L 350 374" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" />

  <!-- 3. Inner Recessed Crater (No Glows) -->
  <circle cx="256" cy="256" r="140" fill="url(#recess)" stroke="#050506" stroke-width="6" />
  
  <!-- Physical Concentric Machined Ridges (Replaces the glow) -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#1F222B" stroke-width="1.5" opacity="0.7" />
  <circle cx="256" cy="256" r="114" fill="none" stroke="#1A1C23" stroke-width="1" opacity="0.5" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#1F222B" stroke-width="1.5" opacity="0.7" />
  <circle cx="256" cy="256" r="86" fill="none" stroke="#1A1C23" stroke-width="1" opacity="0.5" />

  <!-- 4. Segmented Crimson Reactor Ring (Solid colors, removed the blur filter) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neonRed)" stroke-width="3" opacity="0.9" stroke-dasharray="160 60" stroke-dashoffset="110" stroke-linecap="round" />
  
  <!-- 5. Floating Graphite Play Shard -->
  <path d="M 190 140 L 190 372 L 380 256 Z" fill="url(#shardFace)" stroke="url(#shardEdge)" stroke-width="3" stroke-linejoin="round" filter="url(#shadowHeavy)" />
  
  <!-- Inner Rim Lighting for Play Shard -->
  <path d="M 194 149 L 194 363 L 368 256 Z" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" />

  <!-- 6. Recessed Crimson Energy Core -->
  <path d="M 215 195 L 215 317 L 315 256 Z" fill="#030304" />
  
  <!-- Sharp Core Highlight (No blur filter) -->
  <path d="M 222 208 L 222 304 L 300 256 Z" fill="url(#neonRed)" />
  <path d="M 222 208 L 222 256 L 300 256 Z" fill="#FFFFFF" opacity="0.25" />
  
  <!-- Inner Rim Core Cut -->
  <path d="M 215 195 L 215 317 L 315 256 Z" fill="none" stroke="#000000" stroke-width="2" opacity="0.8" />
</svg>
