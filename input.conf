# ============================================================
# INPUT — clean, intuitive, mpv 0.41-compatible
# UI/context-menu first; no rendering/quality options here.
# ============================================================

# ---------- Dense right-click context menu ----------
# The zz-kde-context-menu.lua script sets these as forced bindings,
# which intentionally overrides ModernZ's secondary-click actions.
MBTN_RIGHT  script-message-to context_menu open
MENU        script-message-to context_menu open
Shift+F10   script-message-to context_menu open

# ---------- Playback ----------
SPACE       cycle pause
ENTER       cycle pause
q           quit
Q           quit-watch-later
ESC         set fullscreen no

# ---------- Window ----------
f           cycle fullscreen
F11         cycle fullscreen
o           cycle ontop

# ---------- Seeking ----------
LEFT        seek -5 exact
RIGHT       seek 5 exact
Shift+LEFT  seek -30 exact
Shift+RIGHT seek 30 exact
PGUP        add chapter -1
PGDWN       add chapter 1
Shift+PGUP  seek 600
Shift+PGDWN seek -600
HOME        seek 0 absolute

# ---------- Volume ----------
UP          add volume 5
DOWN        add volume -5
m           cycle mute

# ---------- Speed ----------
[           multiply speed 1/1.1
]           multiply speed 1.1
BS          set speed 1

# ---------- Audio / subtitles ----------
a           script-binding select/select-aid
A           cycle audio
v           script-binding select/select-sid
V           cycle sub

# ---------- Playlist ----------
>           playlist-next
<           playlist-prev
p           cycle pause
F8          script-binding select/select-playlist

# ---------- Chapters / tracks ----------
Ctrl+LEFT   sub-seek -1
Ctrl+RIGHT  sub-seek 1

# ---------- Screenshots ----------
s           screenshot
S           screenshot video
Ctrl+s      screenshot window

# ---------- Information ----------
i           script-binding stats/display-page-1-toggle
I           script-binding stats/display-page-5-toggle
`           script-binding commands/open

# ---------- Loop ----------
l           ab-loop
L           cycle-values loop-file inf no

# ---------- Frame stepping ----------
.           frame-step
,           frame-back-step

# ---------- Audio delay ----------
Ctrl+[      add audio-delay -0.1
Ctrl+]      add audio-delay 0.1

# ---------- Subtitle delay ----------
Alt+[       add sub-delay -0.1
Alt+]       add sub-delay 0.1

# ---------- ModernZ ----------
TAB         script-binding modernz/visibility
w           script-binding modernz/progress-toggle
x           script-message-to modernz osc-show
y           script-message-to modernz osc-hide
z           script-message-to modernz osc-idlescreen
