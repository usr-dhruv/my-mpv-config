# =====================================================================
# 1. HARDWARE-AWARE VIDEO PIPELINE
# =====================================================================
# Prefer the libplacebo renderer and Vulkan path verified on this machine;
# retain OpenGL/Wayland as a driver fallback.
vo=gpu-next
gpu-api=vulkan,opengl
gpu-context=waylandvk,wayland
hwdec=auto
# Adds libplacebo's HDR peak tuning and contrast recovery without replacing
# the explicit scaler choices below.
profile=high-quality
# KDE/Wayland is reporting an incorrect estimated refresh rate (~33 Hz) in
# display-resample mode. Audio-clock sync avoids that pacing error; the panel
# still presents through normal Wayland vsync at its actual refresh rate.
video-sync=audio
framedrop=vo
interpolation=no

# High quality at a sensible integrated-GPU cost. Avoid forced sharpening:
# it creates halos and does not restore detail lost by the source encode.
scale=ewa_lanczossharp
cscale=mitchell
dscale=mitchell
correct-downscaling=yes
sharpen=0

# Preserve source/display signaling and let libplacebo choose HDR behavior.
video-output-levels=auto
fbo-format=auto
tone-mapping=auto
hdr-compute-peak=auto
target-colorspace-hint=auto
icc-profile-auto=yes
dither-depth=auto
deband=no

# =====================================================================
# 2. SUBTITLES & AUDIO
# =====================================================================
sub-auto=exact
sub-use-margins=yes
sub-ass-override=scale
sub-font="Righteous"
sub-fonts-dir="~~/fonts"
osd-font-size=24
osd-duration=1800

# PipeWire is the configured bit-perfect route to the DAC. Keep mpv in the
# stable shared PipeWire path; the system graph already handles bit-perfect
# routing, while exclusive mode can cause clock/underrun glitches with video
# synchronized to audio.
ao=pipewire
audio-exclusive=no
audio-channels=stereo
audio-normalize-downmix=no
#audio-resample-max-shift=0
# -------------------- Screenshots --------------------
screenshot-format=png
screenshot-png-compression=7
screenshot-template=~~desktop/mpv/%F-%P

# -------------------- Files / playback --------------------
keep-open=always
hr-seek=yes
hr-seek-demuxer-offset=10
osd-bar=no
term-osd-bar=no


# -------------------- YouTube / network --------------------
# Let yt-dlp/mpv negotiate a high-quality stream.
ytdl-format=bestvideo*+bestaudio/best

watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y


# -------------------- Wayland behaviour --------------------
wayland-app-id=mpv
# Start every video at exactly half the active display in both dimensions.
# The explicit geometry keeps the initial window centered where supported.
autofit=50%x50%
geometry=50%:50%
# Do not use gpu-next corner-rounding here: it masks the video rectangle,
# not the Wayland window, producing black/transparent corners in the image.

# =====================================================================
# UI / MODERNZ / WAYLAND PRESENTATION
# =====================================================================
# UI only. The rendering, decoder, scaling, HDR/SDR and audio choices above
# are intentionally preserved.

osc=no
title-bar=no
border=no
save-position-on-quit=yes

# We provide a user-level mpv 0.41-compatible context_menu.lua below.
# Keep mpv 0.41's built-in context menu renderer enabled.
load-context-menu=yes

# System-wide UI font. Subtitle font is independently configured above if set.
osd-font="Righteous"
osd-fonts-dir="~~/fonts"
osd-bold=yes
osd-outline-size=0
osd-blur=0
osd-shadow-offset=0

# Neutral telemetry OSD: warm semibold text, charcoal glass panel, crimson only
# for selected list items instead of every line of diagnostic output.
osd-color="#FFF0E1E1"
osd-border-style=background-box
osd-back-color="#C812141A"
osd-outline-color="#FF12141A"
osd-selected-color="#FFCC0A27"
osd-selected-outline-color="#FF12141A"

wayland-app-id=mpv
